# tuxwall.org access log format (http context, used by the tuxwall-org
# vhost). Same shape as nginx's "combined" (CrowdSec/log parsers keep
# working) but any request whose query string mentions a key is logged
# path-only: old TuxWall dashboards look up their reporter key with
# GET /register?key=<raw key>, which must never land in a log.
map $request_uri $tuxwall_org_log_uri {
    "~*\?.*key" $uri;
    default     $request_uri;
}

log_format tuxwall_org '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $tuxwall_org_log_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
