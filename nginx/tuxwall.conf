# tuxwall dashboard site - reverse proxy for the Python API backend.
#
# Optional: add listen directives for your gateway LAN IPs so the dashboard
# is reachable by IP on each interface, e.g.:
#   listen 192.168.1.1:80 default_server;
#   listen 10.0.0.1:80 default_server;
#   listen [fd00:1::1]:80 default_server;
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;
    server_tokens off;

    # Dashboard API -> Python backend
    location /api/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block access to Python source files
    location ~ \.py$ {
        return 404;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        error_page 403 =200 @empty_response;
        deny all;
        try_files $uri $uri/ =404;
    }

    location @empty_response {
        return 200 '';
        default_type text/html;
    }
}
