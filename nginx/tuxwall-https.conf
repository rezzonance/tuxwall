# TuxWall dashboard over TLS — router.housenetwork.site
#
# Additive by design. The existing HTTP `tuxwall` site stays the
# default_server on :80, so http://192.168.1.1/ keeps working as a
# fallback. Only this hostname is forced to HTTPS. That fallback is what
# makes the HSTS header below safe: if the certificate ever fails to
# renew, the browser will refuse router.housenetwork.site but you can
# still reach the dashboard by IP over HTTP.
#
# Name-based only — deliberately NOT default_server, so it cannot take
# over the public :443 vhosts (tuxwall-org, forum, homeassistant).
# Bound to the LAN/VPN addresses only, so it is never offered on the WAN.

server {
    # LAN, WireGuard, and LAN IPv6 only.
    listen 192.168.1.1:443 ssl;
    listen 10.0.0.1:443 ssl;
    listen [fd00:1::1]:443 ssl;
    http2 on;

    server_name router.housenetwork.site;
    server_tokens off;

    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/router.housenetwork.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/router.housenetwork.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TuxwallTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Pins this hostname to HTTPS in the browser for a year. No
    # includeSubDomains: other *.housenetwork.site services are
    # unaffected. To back it out, serve `max-age=0` here and visit the
    # host once over HTTPS before removing the header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # opencode agent SSE stream — must stay open and unbuffered: the agent
    # can idle for minutes awaiting a permission approval, and the default
    # 60s proxy_read_timeout would kill the stream mid-turn.
    location = /api/agent/events {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # LAN/VPN IPv6 (fd00:1::/64 LAN, fd00:2::/64 WireGuard). Without
        # this, any client reaching the dashboard over IPv6 is denied.
        allow fd00::/8;
        deny all;

        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Login brute-force throttle (zone: conf.d/tuxwall-limits.conf).
    location = /api/auth/login {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # LAN/VPN IPv6 (fd00:1::/64 LAN, fd00:2::/64 WireGuard). Without
        # this, any client reaching the dashboard over IPv6 is denied.
        allow fd00::/8;
        deny all;

        limit_req zone=tuxwall_login burst=15 nodelay;

        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard API -> Python backend.
    # X-Forwarded-Proto is https here, which is what makes the backend
    # add `; Secure` to the session cookie.
    location /api/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # LAN/VPN IPv6 (fd00:1::/64 LAN, fd00:2::/64 WireGuard). Without
        # this, any client reaching the dashboard over IPv6 is denied.
        allow fd00::/8;
        deny all;

        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Never serve Python source.
    location ~ \.py$ {
        return 404;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # LAN/VPN IPv6 (fd00:1::/64 LAN, fd00:2::/64 WireGuard). Without
        # this, any client reaching the dashboard over IPv6 is denied.
        allow fd00::/8;
        error_page 403 =200 @empty_response;
        deny all;
        try_files $uri $uri/ =404;
    }

    location @empty_response {
        return 200 '';
        default_type text/html;
    }
}

# Redirect this hostname only. The catch-all :80 default_server in the
# `tuxwall` site is untouched, so bare-IP access still works.
server {
    listen 192.168.1.1:80;
    listen 10.0.0.1:80;
    listen [fd00:1::1]:80;

    server_name router.housenetwork.site;
    server_tokens off;

    return 301 https://$host$request_uri;
}
