# TuxWall 2026-11-03: unbound's log-local-actions (always_nxdomain block
# notifications) are consumed by the dashboard's Traffic Monitor from
# JOURNALD (journalctl -u unbound), not from this file. Duplicating them
# into /var/log/syslog wrote ~583k lines/day of noise for nothing.
# Drop them here; journald is unaffected (and has its own size caps).
if $programname == 'unbound' and $msg contains 'always_nxdomain' then stop
