# TuxWall dashboard API sandbox: writable paths missing from tuxwall.service.
#
# tuxwall.service runs with ProtectSystem=full (/usr, /boot, /efi and /etc
# read-only for the API and every command it runs, ufw included) and lists
# what it may write in ReadWritePaths=. These entries ADD to that list.
# "-" = skipped when the path does not exist on this box (no 226/NAMESPACE).
# Directories, not files: the API writes temp file + rename in the target's
# directory, which a single-file entry cannot allow.
#
#   /etc/default   firewall snapshot restore and its 60 s auto-rollback
#                  (/etc/default/ufw.tuxwall-tmp -> /etc/default/ufw),
#                  "ufw default <policy>" (Firewall > default policies),
#                  backup -> firewall snapshot import of etc/default/ufw
#   /etc/avahi /etc/suricata   re-rendered by interface assignments
#   the rest       restore targets of System > Backups (backups.py ITEMS)
#
# A namespace change needs a full restart: systemctl daemon-reload &&
# systemctl restart tuxwall (reload keeps the old namespace).
# tools/unit_paths_check.py keeps this list in step with the code.
[Service]
ReadWritePaths=-/etc/default -/etc/avahi -/etc/suricata -/etc/ssh -/etc/letsencrypt -/etc/opencanaryd -/etc/chrony -/etc/sudoers.d -/etc/cron.d -/etc/networkd-dispatcher -/etc/modules-load.d -/etc/systemd/network
