# TuxWall brute-force backstop (live patch 2026-09-06).
# http-context zones; only referenced from the tuxwall site, but zones are
# global to nginx so this ships as a conf.d drop-in.
limit_req_zone $binary_remote_addr zone=tuxwall_login:1m rate=10r/m;
limit_req_status 429;

# tuxwall-collector ingest (/report): coarse per-client sieve. Precise
# per-key throttle + dedupe happen inside the collector itself.
limit_req_zone $binary_remote_addr zone=tuxwall_report:1m rate=30r/m;