# Universal unbound config - managed by the tuxwall package.
# Unix-socket control (cert-free): enables `unbound-control reload`,
# which every hot-reload path in tuxwall depends on (blocklist updates,
# RPZ applies, client bans). Without this file those all fail with
# "connection refused" and a full unbound restart is required instead.
remote-control:
  control-enable: yes
  control-interface: /run/unbound.ctl
