# Resilience override for unbound on a tuxwall gateway.
#
# DNS is the most load-bearing service on the LAN: every device depends on
# it. Upstream's default start limit (5 failures in 10s -> give up forever)
# turns any transient condition into a PERMANENT outage: e.g. an unbound
# restart while an optional interface's address is absent (unplugged link,
# VPN down) hits "can't bind socket" five times, then unbound stays dead
# even after the address returns - observed live: an unplugged worknet link
# plus an unattended-upgrades restart took down LAN-wide DNS until manual
# console recovery (2026-10-06).
#
# Removing the start limit makes the same failure self-healing: unbound
# keeps retrying, and the moment the address exists again the next restart
# binds successfully and DNS recovers with no human involved.
# Pair this with never binding `interface:` to addresses of optional or
# link-dependent interfaces - prefer access-control ACLs and serve DNS on
# an always-present address instead.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
