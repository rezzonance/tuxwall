server:
    # Keep YES: the dashboard's Traffic Monitor reads these lines from
    # journald (journalctl -u unbound) to show per-client DNS-block events.
    # The syslog spam they used to cause is handled by the rsyslog rule
    # pkg/etc/rsyslog.d/45-tuxwall-unbound.conf (drops the always_nxdomain
    # noise from /var/log/syslog; journald is unaffected and rate-capped).
    log-local-actions: yes
