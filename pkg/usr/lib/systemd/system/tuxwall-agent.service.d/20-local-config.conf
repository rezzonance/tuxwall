# TuxWall 3.3.5: owner additions to the AI agent config.
# /etc/tuxwall/opencode.json (package defaults, conffile) stays OPENCODE_CONFIG.
# /etc/tuxwall/opencode.local.json (custom providers, default model - written
# by the dashboard, never by the package) is handed to opencode as
# OPENCODE_CONFIG_CONTENT, a config layer above it: objects merge key by key,
# local values win. It is read at start, so the dashboard restarts the agent
# after a change. A missing or invalid local file -> the defaults alone.
# Package file (not a conffile); local changes belong in
# /etc/systemd/system/tuxwall-agent.service.d/.
[Service]
RuntimeDirectory=tuxwall-agent
RuntimeDirectoryMode=0700
ExecStartPre=-/usr/bin/python3 /usr/local/lib/tuxwall/opencode_config.py env /run/tuxwall-agent/local-config.env
EnvironmentFile=-/run/tuxwall-agent/local-config.env
