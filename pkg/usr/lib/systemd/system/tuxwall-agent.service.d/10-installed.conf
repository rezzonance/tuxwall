# TuxWall: start the AI agent only once opencode is installed.
# Without the binary the unit is skipped ("unmet condition") instead of
# crash-looping. Install it with:
#   sudo bash /usr/local/share/tuxwall/scripts/setup-opencode-agent.sh
# Package file (not a conffile); local changes belong in
# /etc/systemd/system/tuxwall-agent.service.d/.
[Unit]
ConditionFileIsExecutable=/home/tuxwall-agent/.opencode/bin/opencode
