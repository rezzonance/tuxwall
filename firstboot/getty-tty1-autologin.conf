# TuxWall first-boot autologin (installed only for the first boot).
# Autologins to root on tty1 so the first-boot wizard can run interactively in
# a real login session. firstboot-autologin.sh removes this file when the
# appliance is configured, restoring normal login for subsequent boots.
# The ExecStart= (empty) is required to clear the default agetty command.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud tty1 115200,38400,9600 $TERM
