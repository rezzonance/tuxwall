# TuxWall first-boot autologin on the serial console (installed only for the
# first boot). Autologins to root on ttyS0 so the first-boot wizard can run
# interactively over the serial console on headless installs.
# firstboot-autologin.sh removes this file when the appliance is configured.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud ttyS0 115200,38400,9600 $TERM
