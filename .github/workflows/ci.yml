name: CI

# Gates for the shipped dashboard code. Two bug classes motivated this:
#   1. Module-level use-before-define (the original crash loop) - caught
#      by tools/py-name-check.py, kept running here.
#   2. An identifier that compiles but never resolves at RUNTIME - the
#      3.2.0 release shipped a definition/usage name mismatch that made
#      every install's CrowdSec panel raise NameError. Syntax checks and
#      the module-level gate both passed it. Caught two ways here:
#      ruff F821 (undefined names in ANY scope) and an import-time smoke
#      test that actually executes the code paths (tools/api_server_smoke.py).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-server:
    name: api_server.py gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the runtime: Ubuntu 26.04 LTS ships python3.14.
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff pyyaml

      - name: Byte-compile
        run: python3 -m py_compile www/includes/api_server.py www/includes/topology.py www/includes/assign_plan.py www/includes/assign_apply.py www/includes/fw_guard.py www/includes/fw_snap.py www/includes/backups.py www/includes/kea_conf.py www/includes/crowdsec_fw.py

      - name: Module-level name order (existing gate)
        run: python3 tools/py-name-check.py www/includes/api_server.py

      - name: Undefined names, all scopes (the 3.2.0 bug class)
        # F821 only, isolated config: pre-existing style findings must not
        # fail this gate - an undefined name is always a release blocker.
        run: ruff check --select F821 --isolated www/includes/api_server.py tools/plugin_security_check.py tools/auth_gate_check.py tools/nginx_listen_check.py pkg/usr/local/sbin/tuxwall-nginx-listen www/includes/topology.py www/includes/assign_plan.py www/includes/assign_apply.py www/includes/fw_guard.py www/includes/fw_snap.py www/includes/fw_lint.py www/includes/fw_edit.py www/includes/fw_hits.py www/includes/canary_egress.py www/includes/backups.py www/includes/kea_conf.py www/includes/crowdsec_fw.py plugins/*/main.py pkg/usr/local/sbin/tuxwall-tripwire pkg/usr/local/sbin/tuxwall-bouncer-nft-migrate tools/kea_conf_check.py tools/bouncer_migrate_check.py tools/pkg_scripts_check.py tools/agent_setup_check.py tools/unit_paths_check.py tools/tripwire_check.py tools/deception_check.py tools/custom_blocklist_check.py tools/port_owner_check.py collector/tuxwall-collector.py scripts/tuxwall-collector-admin tools/collector_severity_check.py pkg/usr/local/lib/tuxwall/opencode_config.py tools/opencode_config_check.py tools/sqm_check.py tools/stray_files_check.py tools/privacy_check.py tools/release_workflow_check.py tools/deb_contents_check.py

      - name: Import + behavior smoke test
        run: python3 tools/api_server_smoke.py

      - name: Interface assignments (render, validation, sandboxed apply/rollback)
        # pure tests: sample topologies in a temp tree, mocked service runner
        run: python3 tools/interface_assign_check.py

      - name: Firewall safety (guard classification/invariants, snapshots in a temp root)
        # pure tests: fixtures in a temp tree, mocked command runner
        run: python3 tools/firewall_safety_check.py

      - name: Collector trust model, limits, caching, escaping (scratch DB + loopback HTTP)
        run: python3 tools/collector_severity_check.py

      - name: Tripwire engine (sandboxed - evaluation, rule plan, notify dedupe, state lock, watchers, daemon)
        # pure tests: temp root, firewall stubbed, pushes to a file, kernel log = a tailed file
        run: python3 tools/tripwire_check.py

      - name: Deception layer (tarpit limits, LAN/never-ban guard, report queue, canary rules; sandboxed)
        # pure tests: temp root, subprocess + collector transport stubbed, loopback-only load test
        run: python3 tools/deception_check.py

      - name: Custom banlist sync (diff, refresh, guards, add/remove; fake cscli in a temp root)
        # pure tests: banlist file in a temp dir, cscli answered from an in-memory decision table
        run: python3 tools/custom_blocklist_check.py

      - name: Port ownership incidents (systemd socket activation, sshd/canary split)
        # pure tests: synthetic ss / systemctl list-sockets output
        run: python3 tools/port_owner_check.py

      - name: Backup safety (sanitizer leak fixtures, retention, limits, restore in a temp root)
        # pure tests: synthetic archives in a temp tree, fake backup script
        run: python3 tools/backup_safety_check.py

      - name: Kea config with comments (tolerant reader, header kept, reservation API on a commented file)
        # pure tests: temp files, Kea reload stubbed
        run: python3 tools/kea_conf_check.py

      - name: CrowdSec bouncer nftables upgrade migration (simulated host, zero gap, rollback)
        # pure tests: systemctl/nft/iptables/ipset answered from an in-memory model in a temp root
        run: python3 tools/crowdsec_fw_check.py && python3 tools/bouncer_migrate_check.py

      - name: Package maintainer scripts (tripwire enable-once, bouncer migration gating, unbound/firewall/nginx/NAT)
        # pure tests: postinst/prerm functions run with bash against a fake systemctl
        run: python3 tools/pkg_scripts_check.py

      - name: AI assistant install (packaged paths, pinned + checksum-verified opencode, unit drop-in, not-installed API state)
        # pure tests: setup script sourced with curl/uname stubbed, temp dirs only
        run: python3 tools/agent_setup_check.py

      - name: Plugin permissions, pinning and integrity (temp plugin dir, GitHub answered in memory)
        # pure tests: config 0600, commit-pinned installs, update preview/confirm, tamper -> refused, TOFU
        run: python3 tools/plugin_security_check.py

      - name: Role gates over HTTP (admin-only logs, no router location before login)
        # loopback server with in-memory users/sessions
        run: python3 tools/auth_gate_check.py

      - name: nginx host-neutral site + generated listen include (render, guard, nginx -t when available)
        run: python3 tools/nginx_listen_check.py

      - name: tuxwall.service sandbox covers every path the API writes (ReadWritePaths vs the write-site audit)
        # pure tests: parses the shipped unit + drop-ins and the code's path constants/literals
        run: python3 tools/unit_paths_check.py

      - name: Privacy (no maintainer domain or public address ranges in any tracked file)
        run: python3 tools/privacy_check.py

      - name: No stray backup/editor files tracked in www/ pkg/ scripts/ nginx/
        run: python3 tools/stray_files_check.py

      - name: SQM helper packaged, generic, --dry-run equals a real run (stubbed tc/ip in a temp dir)
        run: python3 tools/sqm_check.py

      - name: GitHub Releases (apt.yml structure, publish steps unchanged, tools/github-release.sh with a fake gh + throwaway key)
        run: python3 tools/release_workflow_check.py

      - name: AI agent config split (package defaults + opencode.local.json; lossless migration; API writes the local file)
        # pure tests: temp dirs, systemctl stubbed; fixtures for unmodified / owner-added / ambiguous configs
        run: python3 tools/opencode_config_check.py

  package:
    name: .deb build + contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb (same steps as apt.yml)
        run: |
          mkdir -p pkg/var/www/html
          cp -r www/. pkg/var/www/html/
          dpkg-deb --root-owner-group --build pkg tuxwall_ci_all.deb
          dpkg-deb --info tuxwall_ci_all.deb | head -8

      - name: Contents (new 3.3.5 files + modes, moved-out files gone, conffiles) and no stray files
        run: |
          python3 tools/deb_contents_check.py tuxwall_ci_all.deb
          python3 tools/stray_files_check.py --deb tuxwall_ci_all.deb

  dashboard:
    name: dashboard.js gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check www/scripts/dashboard.js
          node --check www/scripts/community-settings.js
          node --check www/scripts/ai-panel.js
