name: Publish APT repository

# Builds the tuxwall .deb from pkg/ + www/ and publishes a signed APT
# repository to GitHub Pages (gh-pages branch) on every version tag.
#
# One-time setup (see README "APT repository" section):
#   1. Add repository secret APT_GPG_PRIVATE_KEY (armored private key,
#      exported from the maintainer's GPG keyring; the matching public
#      key is committed as apt-public.asc)
#   2. Enable GitHub Pages for the gh-pages branch (repo Settings ->
#      Pages -> Deploy from a branch -> gh-pages / root)
#
# Requires the pushed tag to match the version in pkg/DEBIAN/control
# (e.g. tag v2.4.0 for "Version: 2.4.0") so a release can never silently
# ship an untagged version.
#
# After publishing, the "release" job creates/updates the GitHub Release of
# the tag (tools/github-release.sh): notes = the annotated tag message,
# assets = the exact published .deb + SHA256SUMS + SHA256SUMS.asc (signed
# with the same apt key), newest tag marked latest. It also backfills
# releases of the tags in BACKFILL_TAGS that lack those assets.
# workflow_dispatch with a tag (re)runs only the release step for that tag;
# without one it publishes from the selected ref as before.
#
# Then the "images" job builds the install images from the tag -
# image/netinstall/build.sh (netinstall ISO) and image/vm/build.sh --latest
# (VM qcow2 from the newest signed Ubuntu cloud image) - checks them
# (image/verify-images.sh: SHA-256, BIOS + UEFI El Torito, qemu-img check,
# GitHub's 2 GiB asset limit) and attaches them to the release with
# re-signed SHA256SUMS (tools/github-release.sh --assets). Tags without
# image/ (v3.3.6 and older) are skipped. workflow_dispatch: tag + images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Only (re)create the GitHub Release of this existing tag, e.g. v3.3.4 (empty: publish as before)"
        required: false
        default: ""
      images:
        description: "Also build + attach the install images (netinstall ISO, VM qcow2) of that tag"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pkg/DEBIAN/control
        id: ver
        run: |
          VERSION="$(sed -n 's/^Version: //p' pkg/DEBIAN/control)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag $TAG does not match pkg/DEBIAN/control Version: ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils rsync

      - name: Sync www/ into package tree
        run: |
          mkdir -p pkg/var/www/html
          cp -r www/. pkg/var/www/html/

      - name: Build .deb
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          dpkg-deb --root-owner-group --build pkg "tuxwall_${VERSION}_all.deb"
          dpkg-deb --info "tuxwall_${VERSION}_all.deb" | head -8

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build APT repository tree
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # The package is Architecture: all. Publish the index under
          # binary-amd64 (what amd64 clients fetch by default) as well as
          # binary-all, and declare both in Release::Architectures — otherwise
          # apt on amd64 prints "Skipping acquire of configured file
          # 'main/binary-amd64/Packages' ... doesn't support architecture".
          mkdir -p apt/pool/main/t/tuxwall \
                   apt/dists/stable/main/binary-all \
                   apt/dists/stable/main/binary-amd64
          cp "tuxwall_${VERSION}_all.deb" apt/pool/main/t/tuxwall/
          cp apt-public.asc apt/public.asc
          cp tuxwall-install.sh apt/

          cd apt
          apt-ftparchive packages pool/main \
            > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages
          cp dists/stable/main/binary-amd64/Packages \
             dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="TuxWall" \
            -o APT::FTPArchive::Release::Label="TuxWall APT Repository" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="all amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="TuxWall network firewall dashboard" \
            release dists/stable > dists/stable/Release

          gpg --batch --local-user "$GPG_FPR" \
            --armor --detach-sign \
            --output dists/stable/Release.gpg dists/stable/Release
          gpg --batch --local-user "$GPG_FPR" \
            --clearsign \
            --output dists/stable/InRelease dists/stable/Release

          echo "--- tree ---"
          find . -type f | sort

      - name: Publish to GitHub Pages (gh-pages branch)
        run: |
          # Overlay the apt tree onto the EXISTING gh-pages branch.
          # The previous force-orphan publish rebuilt the branch from the
          # apt tree alone, which wiped plugins/catalog.json (the plugin
          # catalog workflow publishes there too) - the two publishers
          # must coexist on one branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          # stash the built apt tree outside the worktree first: the
          # checkout + clean below must also purge OTHER untracked build
          # artifacts (pkg/ from the www sync, the built .deb at root) or
          # git add -A sweeps them onto gh-pages
          rm -rf /tmp/apt-tree && cp -a apt /tmp/apt-tree
          git checkout --force gh-pages
          git reset --hard origin/gh-pages
          git clean -fdx
          cp -a /tmp/apt-tree/. .
          git add -A
          git diff --cached --quiet && echo "apt tree unchanged" && exit 0
          git commit -m "apt: publish tuxwall ${{ steps.ver.outputs.version }}"
          # the catalog workflow pushes to gh-pages concurrently: retry
          # with rebase when we lose that race
          for i in 1 2 3; do
            if git push origin gh-pages; then break; fi
            echo "push failed (attempt $i) - rebasing onto remote"
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done

  release:
    name: GitHub Release (notes, .deb, signed SHA256SUMS)
    needs: publish
    if: always() && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # releases published before this job existed (assets backfilled once;
      # complete releases are skipped)
      BACKFILL_TAGS: v3.3.2 v3.3.3 v3.3.4
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch annotated tags and the published apt tree
        # actions/checkout can leave the pushed tag as a lightweight ref;
        # --force restores the annotated tag objects (the release notes)
        run: |
          git fetch --force --tags origin
          git fetch origin gh-pages

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Create or update GitHub Releases
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PAGES_REF: origin/gh-pages
        run: |
          rc=0
          if [ -n "${INPUT_TAG:-}" ]; then
            bash tools/github-release.sh --force "$INPUT_TAG" || rc=1
          else
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
              bash tools/github-release.sh --force "$GITHUB_REF_NAME" || rc=1
            fi
            # shellcheck disable=SC2086
            bash tools/github-release.sh $BACKFILL_TAGS || rc=1
          fi
          exit "$rc"

  images:
    name: Install images (netinstall ISO, VM qcow2)
    needs: release
    if: always() && needs.release.result == 'success' && ((github.event_name == 'push' && github.ref_type == 'tag') || (inputs.tag != '' && inputs.images))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Fetch annotated tags
        run: git fetch --force --tags origin

      - name: Check the tag
        id: tag
        run: |
          VERSION="$(sed -n 's/^Version: //p' pkg/DEBIAN/control)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match pkg/DEBIAN/control Version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -x image/netinstall/build.sh ] && [ -x image/vm/build.sh ] && [ -x image/verify-images.sh ]; then
            echo "build=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG predates the install images - nothing to build"
            echo "build=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install image tools
        if: steps.tag.outputs.build == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso qemu-utils e2fsprogs fdisk gpgv ubuntu-keyring ubuntu-cloudimage-keyring python3-yaml

      - name: Build the netinstall ISO
        if: steps.tag.outputs.build == '1'
        run: image/netinstall/build.sh --out "$RUNNER_TEMP/images" --cache "$RUNNER_TEMP/cache"

      - name: Build the VM image
        if: steps.tag.outputs.build == '1'
        run: image/vm/build.sh --latest --out "$RUNNER_TEMP/images" --cache "$RUNNER_TEMP/cache"

      - name: Verify the images
        if: steps.tag.outputs.build == '1'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          rm -f "$RUNNER_TEMP"/images/*.build.log
          image/verify-images.sh "$RUNNER_TEMP/images" "$VERSION"

      - name: Import signing key
        if: steps.tag.outputs.build == '1'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Attach the images to the GitHub Release
        if: steps.tag.outputs.build == '1'
        run: bash tools/github-release.sh --assets "$RUNNER_TEMP/images" "$TAG"
